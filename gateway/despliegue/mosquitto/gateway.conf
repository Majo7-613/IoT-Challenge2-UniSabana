# Configuración de Mosquitto para el gateway (Raspberry Pi 5).
# Copiar en /etc/mosquitto/conf.d/gateway.conf (docs/guias/raspberry-pi.md).
# Diseño: docs/diseno/gateway.md, sección 4.

# Escucha en todas las interfaces, puerto 1883 (WLAN de la zona).
listener 1883

# Sin acceso anónimo: cada cliente con su usuario y clave.
allow_anonymous false
password_file /etc/mosquitto/passwd

# Permisos por tópico.
acl_file /etc/mosquitto/acl

# La persistencia (mensajes retenidos tras un reinicio) ya viene activada en /etc/mosquitto/mosquitto.conf
# de Raspberry Pi OS; repetirla aquí haría fallar el arranque por opción duplicada.
