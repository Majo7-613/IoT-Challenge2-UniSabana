; =============================================================================
; Proyecto PlatformIO del firmware — IoT Challenge #2, Equipo 7
; Placa: ESP32-DevKitC V4 (módulo ESP32-WROOM-32E), framework Arduino.
; =============================================================================

[platformio]
; `pio run` compila solo el firmware; el entorno native es para las pruebas.
default_envs = esp32dev, wokwi

[env:esp32dev]
; Versión fijada con el primer build exitoso (24/09/2026, `pio pkg list`):
; espressif32 7.1.3 → núcleo Arduino ESP32 2.0.17.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino

; Velocidad del puerto serie para los registros (debe coincidir con config.h).
monitor_speed = 115200

; Archivos del tablero web (carpeta data/) en LittleFS: `pio run -t uploadfs`.
board_build.filesystem = littlefs
monitor_filters = direct

; Nivel de depuración del núcleo: 0 = ninguno … 5 = detallado.
build_flags =
    -D CORE_DEBUG_LEVEL=1

; Advertencias estrictas solo para el código del proyecto (no para el núcleo
; ni las librerías).
build_src_flags =
    -Wall
    -Wextra

; Librerías con versión fija. El servidor web asíncrono y su capa TCP son los
; forks mantenidos por la organización ESP32Async (aún sin usar en el paso 2).
; DHT22: "DHT sensor library" de Adafruit. Reemplaza a "DHT sensor library for
; ESPx" (DHTesp), que en Wokwi daba TIMEOUT en cada lectura (Wiki 3.5 y 5.3).
; BMP180: librería BMP085 de Adafruit (compatible con el BMP180).
; La LCD y JSON se agregan en los pasos siguientes, también con versión fija.
lib_deps =
    esp32async/ESPAsyncWebServer @ 3.12.1
    esp32async/AsyncTCP @ 3.5.0
    adafruit/DHT sensor library @ 1.4.6
    adafruit/Adafruit BMP085 Library @ 1.2.4
    ; Dependencias de la librería BMP085, fijadas para un build reproducible.
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit Unified Sensor @ 1.1.15

; -----------------------------------------------------------------------------
; Compilación para la simulación en Wokwi (simulation/wokwi/). Mismo código y
; mismos pines; SIMULACION solo cambia la atenuación del ADC del GUVA-S12SD,
; porque en Wokwi un potenciómetro entrega de 0 a 3.3 V.
; -----------------------------------------------------------------------------
[env:wokwi]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D SIMULACION

; -----------------------------------------------------------------------------
; Pruebas unitarias en el computador: `pio test -d firmware -e native`.
; Solo compila los módulos sin dependencias del ESP32 (fusión, nivel,
; evaporación y formato de la LCD). Requiere un compilador gcc/g++ en el PATH
; (en Windows, MinGW).
; -----------------------------------------------------------------------------
[env:native]
platform = native @ 1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<fusion.cpp> +<nivel.cpp> +<evaporacion.cpp> +<texto_lcd.cpp>
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
