# SIMULACIÓN — Escenario de Wokwi: arranque y estados NORMAL, ADVERTENCIA y
# ALERTA (CRÍTICO va en critico.yaml) con los parámetros de demostración de config.h
# (montaje 35 cm, altura útil 30 cm; nivel = 35 − distancia).
#
# Ejecutar desde la raíz del repositorio:
#   wokwi-cli simulation/wokwi --scenario simulation/wokwi/escenarios/estados.yaml \
#     --timeout 300000 --serial-log-file tests/datos/simulacion/estados.log
# El plan gratuito de Wokwi corta la sesión de wokwi-cli a los 5 minutos de
# tiempo real (unos 220 s simulados), por eso los estados van en dos escenarios.
# Nota: las capturas de la LCD con wokwi-cli no muestran los caracteres (probado
# también con la librería LiquidCrystal_I2C), así que no se toman; el contenido
# de la LCD queda en el registro serie (líneas "tHMI LCD |...|").
name: 'SIMULACIÓN: arranque, NORMAL, ADVERTENCIA y ALERTA'
version: 1
author: 'Equipo 7'

steps:
  # Arranque: distancia 13 cm → nivel 22 cm (73 %), T 18 °C, HR 70 %.
  - wait-serial: 'paso 5'
  - delay: 1500ms

  # NORMAL (la transición INICIANDO -> NORMAL ocurre en los primeros ciclos).
  - delay: 8000ms

  # ADVERTENCIA: distancia 24 cm → nivel 11 cm (37 %, umbral preventivo 40 %).
  - set-control:
      part-id: nivel
      control: distance
      value: 24
  - wait-serial: '-> ADVERTENCIA'
  - delay: 3000ms

  # Regreso a NORMAL (sale del preventivo por encima de 45 %) y espera a que
  # la ventana de la tendencia (60 s) ya no contenga el cambio brusco.
  - set-control:
      part-id: nivel
      control: distance
      value: 13
  - delay: 70000ms

  # ALERTA: descenso sostenido del nivel de 1 cm cada 20 s (−3 cm/min), sin
  # llegar al umbral preventivo, con UV alto (potenciómetro al 25 %; en la
  # ejecución del 05/10/2026 entregó 1004 mV, índice ≈ 10 ≥ 6). La temperatura de 31 °C también se fija, pero en Wokwi
  # el DHT22 no responde a la librería DHTesp (TIMEOUT), así que no cuenta.
  - set-control:
      part-id: dht
      control: temperature
      value: 31
  - set-control:
      part-id: guva
      control: position
      value: 0.25
  - set-control: { part-id: nivel, control: distance, value: 14 }
  - delay: 20000ms
  - set-control: { part-id: nivel, control: distance, value: 15 }
  - delay: 20000ms
  - set-control: { part-id: nivel, control: distance, value: 16 }
  - delay: 20000ms
  - set-control: { part-id: nivel, control: distance, value: 17 }
  - delay: 20000ms
  - set-control: { part-id: nivel, control: distance, value: 18 }
  - delay: 20000ms
  - delay: 5000ms
